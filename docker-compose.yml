services:
  postgres:
    image: postgres:17-alpine
    container_name: takehome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: takehome
      POSTGRES_PASSWORD: takehome
      # The dev database. The test database (takehome_test) is created by
      # the init script below so `npm test` never touches dev data.
      POSTGRES_DB: takehome
    ports:
      - "5433:5432"
    volumes:
      - takehome-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takehome -d takehome"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  takehome-pgdata:
